name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  # A newer push to the same branch cancels the run still in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose the GitHub Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Warm Docker build cache
        # Runs before the build context gets any secrets, so none end up in the cache. The
        # compose builds below run on the same Buildx builder and reuse these layers.
        run: |
          docker buildx build --cache-from type=gha,scope=project-template-bundle-dev --cache-to type=gha,scope=project-template-bundle-dev,mode=max -f Dockerfile.dev .

      - name: Setup CI environment
        run: make ci-setup

      - name: Run tests
        run: make ci-test

      - name: Generate code coverage
        run: make ci-coverage

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: make ci-cleanup

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose the GitHub Actions cache to Buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Warm Docker build cache
        # Runs before the build context gets any secrets, so none end up in the cache. The
        # compose builds below run on the same Buildx builder and reuse these layers.
        run: |
          docker buildx build --cache-from type=gha,scope=project-template-bundle-dev --cache-to type=gha,scope=project-template-bundle-dev,mode=max -f Dockerfile.dev .

      - name: Setup CI environment
        run: make ci-setup

      - name: Run code quality checks
        run: make ci-quality

      - name: Cleanup
        if: always()
        run: make ci-cleanup
