name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CI environment
        run: make ci-setup

      - name: Run tests
        run: make ci-test

      - name: Generate code coverage
        run: make ci-coverage

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: make ci-cleanup

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CI environment
        run: make ci-setup

      - name: Run code quality checks
        run: make ci-quality

      - name: Cleanup
        if: always()
        run: make ci-cleanup
