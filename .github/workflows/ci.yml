name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build Docker Images and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup CI environment
        run: make ci-setup

      - name: Run tests
        run: make ci-test

      - name: Generate code coverage
        run: make ci-test-coverage

      - name: Copy coverage file from container
        if: success()
        run: docker cp bundle_api:/var/www/coverage.xml ./coverage.xml || true
        continue-on-error: true

      - name: Upload coverage to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

      - name: Show test results
        if: always()
        run: make ci-test || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Docker Container Status ==="
          docker compose -f docker-compose-dev.yaml ps

          echo "=== PHP Extensions ==="
          docker exec bundle_api php -m || true

          echo "=== PHP Info (PDO section) ==="
          docker exec bundle_api php -i | grep -A 10 -i pdo || true

          echo "=== Environment Variables ==="
          docker exec bundle_api env | grep -E "(DATABASE|APP_ENV)" || true

          echo "=== Docker Logs (last 100 lines) ==="
          docker compose -f docker-compose-dev.yaml logs --tail=100

          echo "=== Symfony .env file ==="
          docker exec bundle_api cat .env | grep DATABASE || true

      - name: Cleanup
        if: always()
        run: make ci-cleanup

