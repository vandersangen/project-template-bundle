name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f docker-compose-dev.yaml build

      - name: Start Docker containers
        run: docker compose -f docker-compose-dev.yaml up -d

      - name: Wait for containers to be ready
        run: |
          echo "Waiting for containers to start..."
          sleep 10

          echo "Checking PHP container..."
          docker exec bundle_api php -v

      - name: Install Composer dependencies
        run: docker exec bundle_api composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHP CodeSniffer
        run: docker exec bundle_api vendor/bin/phpcs --standard=phpcs.xml src/ bundle/src/ || true
        continue-on-error: true

      - name: Run PHPMD
        run: docker exec bundle_api vendor/bin/phpmd src/,bundle/src/ text phpmd.xml || true
        continue-on-error: true

      - name: Run PHPStan
        run: docker exec bundle_api vendor/bin/phpstan analyse -c phpstan.neon || true
        continue-on-error: true

      - name: Run Rector (dry-run)
        run: docker exec bundle_api vendor/bin/rector process --dry-run || true
        continue-on-error: true

      - name: Stop Docker containers
        if: always()
        run: docker compose -f docker-compose-dev.yaml down -v

