services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Auto-register all services in the bundle
    VanDerSangen\ProjectTemplateBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/ProjectTemplateBundle.php'
            - '../src/User/Entity/'
            - '../src/User/Enum/'
            - '../src/Mail/Entity/'
            - '../src/Mail/Enum/'
            - '../src/Mail/Template/'
            - '../src/Queue/Message/'
            - '../src/Queue/Entity/'
            - '../src/Queue/Enum/'
            - '../src/Cron/Entity/'
            - '../src/SuperAdmin/Entity/'
            - '../src/Tenant/Entity/'
            - '../src/Payment/Entity/'
            - '../src/Payment/Enum/'
            - '../src/Payment/Event/'
            - '../src/Payment/Message/'
            - '../src/Invoice/Entity/'
            - '../src/Invoice/Enum/'
            - '../src/Invoice/Dto/'
            - '../src/Shopify/Entity/'
            - '../src/Shopify/Enum/'
            - '../src/Shopify/Exception/'

    # Controllers
    VanDerSangen\ProjectTemplateBundle\Api\Controller\:
        resource: '../src/Api/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Auth\Controller\:
        resource: '../src/Auth/Controller/'
        tags: ['controller.service_arguments']

    # 2FA controller needs the configured issuer name for provisioning URIs
    VanDerSangen\ProjectTemplateBundle\Auth\Controller\TwoFactorController:
        arguments:
            $issuer: '%project_template.two_factor.issuer%'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\User\Controller\:
        resource: '../src/User/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Cron\Controller\:
        resource: '../src/Cron/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\SuperAdmin\Controller\:
        resource: '../src/SuperAdmin/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Payment\Controller\:
        resource: '../src/Payment/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Tenant\Controller\:
        resource: '../src/Tenant/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Shopify\Controller\:
        resource: '../src/Shopify/Controller/'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Routing\ProjectTemplateRouteLoader:
        tags: [routing.route_loader]

    # Mail Module Service
    VanDerSangen\ProjectTemplateBundle\Mail\Service\MailService:
        arguments:
            $senderEmail: '%project_template.mailer_sender%'

    # Auth-mail sender: default = render + send locally. A consuming project can
    # alias this interface to its own implementation (e.g. send via a central
    # branded mail service) to override.
    VanDerSangen\ProjectTemplateBundle\Auth\Mail\AuthMailSenderInterface:
        alias: VanDerSangen\ProjectTemplateBundle\Auth\Mail\DefaultAuthMailSender
    # Queue Module Services
    VanDerSangen\ProjectTemplateBundle\Queue\Service\QueueService:
        arguments:
            $messageBus: '@messenger.default_bus'
    VanDerSangen\ProjectTemplateBundle\Queue\Handler\SendMailMessageHandler:
        tags:
            - { name: messenger.message_handler }
    VanDerSangen\ProjectTemplateBundle\Queue\Handler\RunCronMessageHandler:
        tags:
            - { name: messenger.message_handler }

    VanDerSangen\ProjectTemplateBundle\Queue\Middleware\QueueJobLogMiddleware:
        arguments:
            $logRepository: '@VanDerSangen\ProjectTemplateBundle\Queue\Repository\QueueJobLogRepository'

    # Custom environment variable processor for Git branch-based database naming
    VanDerSangen\ProjectTemplateBundle\Shared\DependencyInjection\GitBranchEnvVarProcessor:
        tags: ['container.env_var_processor']

    # Env processor: failed transport DSN from MESSENGER_TRANSPORT_DSN + queue_name=failed
    VanDerSangen\ProjectTemplateBundle\Shared\DependencyInjection\MessengerFailedDsnEnvProcessor:
        tags: ['container.env_var_processor']

    # Database copy command (only for dev/test environments)
    VanDerSangen\ProjectTemplateBundle\Shared\Command\DatabaseCopyCommand:
        arguments:
            $environment: '%kernel.environment%'
            $databaseUrl: '%env(DATABASE_URL)%'

    # Master data loader service
    VanDerSangen\ProjectTemplateBundle\Shared\Service\MasterDataLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $environment: '%kernel.environment%'

    # Master data services
    VanDerSangen\ProjectTemplateBundle\Shared\Service\EntityReferenceRegistry:
        # Singleton service to track entity references

    VanDerSangen\ProjectTemplateBundle\Shared\Service\EntityDependencyResolver:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    VanDerSangen\ProjectTemplateBundle\Shared\Service\MasterDataHydrator:
        arguments:
            $objectManager: '@doctrine.orm.entity_manager'
            $referenceRegistry: '@VanDerSangen\ProjectTemplateBundle\Shared\Service\EntityReferenceRegistry'
            $passwordHasher: '@security.user_password_hasher'

    # Payment Module Services
    VanDerSangen\ProjectTemplateBundle\Payment\Client\PaymentApiClient:
        arguments:
            $httpClient: '@http_client'
            $baseUrl: '%project_template.payment.api_base_url%'
            $apiToken: '%project_template.payment.api_token%'

    VanDerSangen\ProjectTemplateBundle\Payment\Controller\PaymentWebhookController:
        arguments:
            $webhookSecret: '%project_template.payment.webhook_secret%'
        tags: ['controller.service_arguments']

    VanDerSangen\ProjectTemplateBundle\Payment\Handler\CreateSubscriptionMessageHandler:
        tags:
            - { name: messenger.message_handler }
    VanDerSangen\ProjectTemplateBundle\Payment\Handler\SyncSubscriptionMessageHandler:
        tags:
            - { name: messenger.message_handler }
    VanDerSangen\ProjectTemplateBundle\Payment\Handler\CancelSubscriptionMessageHandler:
        tags:
            - { name: messenger.message_handler }
    VanDerSangen\ProjectTemplateBundle\Payment\Handler\SyncPaymentMessageHandler:
        tags:
            - { name: messenger.message_handler }

    # Shared credential encryption (used for stored third-party API tokens)
    VanDerSangen\ProjectTemplateBundle\Shared\Service\CredentialEncryptor:
        arguments:
            $secret: '%project_template.encryption_secret%'

    # Shopify Module — Admin API client for merchant-created custom apps
    VanDerSangen\ProjectTemplateBundle\Shopify\Client\ShopifyApiClient:
        arguments:
            $httpClient: '@http_client'
            $apiVersion: '%project_template.shopify.api_version%'

    # Invoice Module — PDF renderer. Default: Gotenberg (headless Chromium sidecar,
    # HTTP API, k8s-friendly). SnappyPdfRenderer remains available for images that
    # ship the wkhtmltopdf binary; switch the alias to use it instead.
    VanDerSangen\ProjectTemplateBundle\Invoice\Service\PdfRendererInterface:
        '@VanDerSangen\ProjectTemplateBundle\Invoice\Service\GotenbergPdfRenderer'
