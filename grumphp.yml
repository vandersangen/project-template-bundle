grumphp:
    process_timeout: 300
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: [
            'docker-compose',
            '-f',
            'docker-compose-dev.yaml',
            'run',
            '--rm',
            '--entrypoint',
            '""',
            '--no-deps',
            'php'
        ]
    tasks:
        # Alleen de Unit-suite: de hook draait via --no-deps, dus de Functional-tests
        # kunnen hier geen database bereiken. Die draaien in CI (ci-test) mét db.
        phpunit:
            config_file: phpunit.dist.xml
            testsuite: Unit
        phpcs:
            standard: phpcs.xml
        shell:
            scripts:
                - [ "-c", "composer audit --abandoned=ignore" ]
