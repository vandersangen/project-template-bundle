grumphp:
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: [
            'docker-compose',
            '-f',
            'docker-compose-dev.yaml',
            'run',
            '--rm',
            '--entrypoint',
            '""',
            '--no-deps',
            'php'
        ]
    tasks:
        phpunit:
            config_file: phpunit.dist.xml
        phpcs:
            standard: phpcs.xml
        shell:
            scripts:
                - [ "-c", "composer audit --abandoned=ignore" ]
