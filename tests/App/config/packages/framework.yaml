framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    http_client: true
    handle_all_throwables: true
    test: true

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.mock_file

    php_errors:
        log: true

    router:
        utf8: true

    property_info:
        with_constructor_extractor: true

