security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto
            cost: 4
            time_cost: 3
            memory_cost: 10
        VanDerSangen\ProjectTemplateBundle\User\Entity\User: 'auto'
        VanDerSangen\ProjectTemplateBundle\SuperAdmin\Entity\SuperAdminUser: 'auto'

    providers:
        app_user_provider:
            entity:
                class: VanDerSangen\ProjectTemplateBundle\User\Entity\User
                property: email
        super_admin_provider:
            entity:
                class: VanDerSangen\ProjectTemplateBundle\SuperAdmin\Entity\SuperAdminUser
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        public:
            pattern: ^/(api/health|api/auth/(login|register|forgot-password|reset-password|2fa/verify)|api/payment/webhook)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - VanDerSangen\ProjectTemplateBundle\Auth\Security\JwtAuthenticator
            entry_point: VanDerSangen\ProjectTemplateBundle\Auth\Security\JwtAuthenticator

        super_admin:
            pattern: ^/super-admin
            provider: super_admin_provider
            form_login:
                login_path: super_admin_login
                check_path: super_admin_login
                enable_csrf: true
                default_target_path: /super-admin/crons
                always_use_default_target_path: true
            logout:
                path: super_admin_logout
                target: super_admin_login

    access_control:
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(login|register|forgot-password|reset-password|2fa/verify), roles: PUBLIC_ACCESS }
        - { path: ^/api/payment/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/super-admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/super-admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api, roles: ROLE_USER }
