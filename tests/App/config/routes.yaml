# Import bundle routes (same as app: type service so routes always load)
project_template_bundle:
    resource: 'VanDerSangen\ProjectTemplateBundle\Routing\ProjectTemplateRouteLoader::loadRoutes'
    type: service
    prefix: /


# Test-only controllers (feature flag attribute)
test_controllers:
    resource:
        path: ../Controller/
        namespace: VanDerSangen\ProjectTemplateBundle\Tests\App\Controller
    type: attribute
