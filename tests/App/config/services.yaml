services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Optional: load with doctrine:fixtures:load in test env to get a SuperAdmin user (username: superadmin, password: test)
    VanDerSangen\ProjectTemplateBundle\Tests\App\DataFixtures\SuperAdminUserFixture:
        tags: [doctrine.fixture.orm]

    # Allow tests to override services via $container->set(...)
    VanDerSangen\ProjectTemplateBundle\Payment\Service\WebhookHandler:
        public: true

    VanDerSangen\ProjectTemplateBundle\Shopify\Client\ShopifyApiClient:
        public: true
        arguments:
            $httpClient: '@http_client'
            $apiVersion: '%project_template.shopify.api_version%'

    VanDerSangen\ProjectTemplateBundle\Tests\App\Security\TestApiUserAuthenticator: ~

    # Whose a signed-in user of the test app is, for the feature flags.
    VanDerSangen\ProjectTemplateBundle\FeatureFlag\FeatureFlagAudienceResolverInterface:
        alias: VanDerSangen\ProjectTemplateBundle\Tests\App\FeatureFlag\TestFeatureFlagAudienceResolver

    VanDerSangen\ProjectTemplateBundle\Tests\App\FeatureFlag\TestFeatureFlagAudienceResolver: ~
